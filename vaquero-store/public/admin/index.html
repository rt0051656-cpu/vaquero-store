<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · EL VAQUERO STORE</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<!-- LOGIN -->
<section id="login" class="login">
  <form id="loginForm" class="panel login-box" autocomplete="on">
    <img src="/img/logo.svg" alt="" width="64" height="64">
    <h1>PANEL DE ADMINISTRACIÓN</h1>
    <p class="hint center">EL VAQUERO STORE · acceso privado</p>
    <label class="lbl" for="user">Usuario</label>
    <input class="input sm" id="user" name="username" autocomplete="username" required>
    <label class="lbl" for="pass">Contraseña</label>
    <input class="input sm" id="pass" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn btn-block" type="submit">INGRESAR</button>
  </form>
</section>

<!-- PANEL -->
<section id="app" hidden>
  <header class="topbar">
    <div class="brand"><img src="/img/logo.svg" alt="" width="40" height="40"><span class="brand-text"><b>EL VAQUERO</b><i>ADMIN</i></span></div>
    <div class="nav"><button class="btn btn-ghost btn-sm" id="refresh">↻ Actualizar</button><button class="btn btn-ghost btn-sm" id="logout">Salir</button></div>
  </header>
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <input class="input sm" id="q" type="search" placeholder="Buscar por referencia o ID de jugador…" inputmode="search">
      <select class="input sm" id="statusFilter"></select>
    </div>
    <p class="hint" id="count"></p>
    <div id="list" class="orders"></div>
  </div>
</section>

<!-- Visor de comprobante -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lb-inner">
    <img id="lbImg" alt="Comprobante de pago">
    <div class="lb-actions">
      <a id="lbDown" class="btn btn-sm" href="#">⬇ Descargar</a>
      <button id="lbClose" class="btn btn-ghost btn-sm">Cerrar</button>
    </div>
  </div>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>
