services:
  - type: web
    name: el-vaquero-store
    runtime: docker
    plan: starter          # el disco persistente requiere un plan de pago
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # Render te la pedirá al crear el servicio
    disk:
      name: vaquero-data
      mountPath: /data
      sizeGB: 1
